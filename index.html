<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baghels' Job Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Baghels' Job Portal</h1>
    </header>
    <main>
        <section class="job-details">
            <h2 class="job-title">Software Developer</h2>
            <div class="details">
                <p><strong>Age:</strong> 25-35 years</p>
                <p><strong>Qualification/Degree:</strong> Bachelor's in Computer Science or equivalent</p>
                <p><strong>Experience:</strong> 2-5 years in software development</p>
                <div class="links">
                    <a href="https://example.com/job" target="_blank">View Job</a>
                    <a href="https://example.com/notification" target="_blank">View Notification</a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>Made by Baghel Bros</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
